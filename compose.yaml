name: video-creator
services:
  init:
    image: video-creator-worker:1.0.0
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    platform: linux/amd64
    user: "0:0"
    entrypoint: ["python", "/app/docker/init_state.py"]
    volumes:
      - video-secrets:/run/video-secrets
      - video-data:/data
    restart: "no"

  video-worker:
    image: video-creator-worker:1.0.0
    platform: linux/amd64
    init: true
    environment:
      VIDEO_API_KEY_FILE: /run/video-secrets/video-api-key
      VIDEO_TOOLS_CONFIG: /opt/video-tools/tools.json
      VIDEO_DATA_DIR: /data
      PLANNER_URL: ${PLANNER_URL:-}
      PLANNER_MODEL: ${PLANNER_MODEL:-}
      PLANNER_API_KEY: ${PLANNER_API_KEY:-}
    volumes:
      - video-secrets:/run/video-secrets:ro
      - video-data:/data
    networks:
      default:
        aliases: [video-creator-worker]
    shm_size: 1gb
    depends_on:
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  openwebui:
    image: video-creator-webui:0.12.4
    build:
      context: .
      dockerfile: docker/Dockerfile.openwebui
    environment:
      USE_SLIM_DOCKER: "true"
      OFFLINE_MODE: "true"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      ENABLE_PIP_INSTALL_FRONTMATTER_REQUIREMENTS: "false"
      ENABLE_OLLAMA_API: "false"
      ENABLE_OPENAI_API: "false"
      DEFAULT_USER_ROLE: user
      ENABLE_SIGNUP: "true"
      ANONYMIZED_TELEMETRY: "false"
    volumes:
      - webui-data:/app/backend/data
      - video-secrets:/run/video-secrets:ro
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 60s
      retries: 10
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${WEBUI_PORT:-3000}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      video-worker:
        condition: service_healthy
      openwebui:
        condition: service_healthy
    restart: unless-stopped

  configure:
    image: video-creator-worker:1.0.0
    platform: linux/amd64
    profiles: ["tools"]
    entrypoint: ["python", "/app/docker/configure_openwebui.py"]
    environment:
      OPENWEBUI_URL: http://openwebui:8080
      VIDEO_API_URL: http://video-creator-worker:8001
      VIDEO_PUBLIC_URL: ${VIDEO_PUBLIC_URL:-http://localhost:3000/video}
      VIDEO_API_KEY_FILE: /run/video-secrets/video-api-key
    volumes:
      - video-secrets:/run/video-secrets:ro
    stdin_open: true
    tty: true
    depends_on:
      openwebui:
        condition: service_healthy
      video-worker:
        condition: service_healthy

volumes:
  webui-data:
  video-data:
  video-secrets:
